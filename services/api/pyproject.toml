[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sakhicircle-api"
version = "0.1.0"
description = "SakhiCircle FastAPI backend"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=50,<51",
  "fastapi>=0.116,<1",
  "firebase-admin>=7,<8",
  "google-adk>=2.7,<3",
  "google-auth>=2.57,<3",
  "google-cloud-bigquery>=3.44,<4",
  "google-cloud-firestore>=2.29,<3",
  "google-cloud-secret-manager>=2.30,<3",
  "google-cloud-tasks>=2.24,<3",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --disable-warnings"

[tool.ruff]
line-length = 100
target-version = "py311"
