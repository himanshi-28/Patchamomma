name: Quality gate

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  deterministic-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pnpm install --frozen-lockfile
      - run: python -m venv .venv
      - run: .venv/bin/pip install --disable-pip-version-check -e 'services/api[dev]'
      - run: pnpm --filter @sakhicircle/web exec playwright install --with-deps chromium
      - run: pnpm test
